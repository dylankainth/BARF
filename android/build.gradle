plugins {
    id 'com.android.application'
}

android {
    namespace 'com.barf'
    compileSdk 35
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "com.barf"
        archivesBaseName = "barf"

        minSdkVersion 24
        targetSdkVersion 35

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    testOptions {
        unitTests {
            // Allow Android framework stubs to return defaults (null/0/false)
            // instead of throwing in plain JUnit tests.
            returnDefaultValues = true
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/jni/CMakeLists.txt')
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    configurations.all {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

dependencies {
    // Core library desugaring for Java 8+ APIs (required by WireGuard)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'

    // AndroidX (replaces old android.support.v4)
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // CameraX for QR pairing camera preview (1.4.2+ for 16KB alignment)
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'

    // ML Kit barcode scanning for QR code detection
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    
    // NanoHTTPD for HTTP server only (WebSocket has known issues)
    implementation('org.nanohttpd:nanohttpd:2.3.1') {
        exclude group: 'com.android.support'
    }
    implementation('org.nanohttpd:nanohttpd-websocket:2.3.1') {
        exclude group: 'com.android.support'
    }
    
    // Use Java-WebSocket for reliable WebSocket support
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'
    
    // Mozilla Rhino for JavaScript execution (Android-compatible fork)
    implementation 'io.apisense:rhino-android:1.1.1'
    
    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // WireGuard Android library for secure pairing
    implementation 'com.wireguard.android:tunnel:1.0.20251231'

    // USB-serial drivers for CP2102, CH340, FTDI, CDC ACM (ESP32 all variants)
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.0'

    // Unit testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
}

// Force CameraX resolution to ensure 16KB alignment
configurations.configureEach {
    resolutionStrategy {
        force "androidx.camera:camera-core:1.4.2",
              "androidx.camera:camera-camera2:1.4.2",
              "androidx.camera:camera-lifecycle:1.4.2",
              "androidx.camera:camera-view:1.4.2"
    }
}
