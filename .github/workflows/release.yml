name: release
on:
  push:
    tags: "v*.*.*"

env:
  NCNN_VERSION: 20260113
  OPENCV_VERSION: 4.13.0
  OPENCV_MOBILE_TAG: v35
  MESA_TURNIP_VERSION: 25.3.3
  BUILD_TOOLS_VERSION: 36.0.0

jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: desktop
      - run: npm run tauri build
        working-directory: desktop
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: ncnn
        run: |
          wget -q https://github.com/Tencent/ncnn/releases/download/${NCNN_VERSION}/ncnn-${NCNN_VERSION}-android-vulkan.zip
          unzip -q ncnn-${NCNN_VERSION}-android-vulkan.zip -d android/src/main/jni

      - name: opencv-mobile
        run: |
          wget -q https://github.com/nihui/opencv-mobile/releases/download/${OPENCV_MOBILE_TAG}/opencv-mobile-${OPENCV_VERSION}-android.zip
          unzip -q opencv-mobile-${OPENCV_VERSION}-android.zip -d android/src/main/jni

      - name: vulkan-turnip-driver
        run: |
          wget -q https://github.com/nihui/mesa-turnip-android-driver/releases/download/${MESA_TURNIP_VERSION}/mesa-turnip-android-${MESA_TURNIP_VERSION}.zip
          mkdir -p android/src/main/jniLibs/arm64-v8a
          unzip -q mesa-turnip-android-${MESA_TURNIP_VERSION}.zip -d android/src/main/jniLibs/arm64-v8a

      - name: modify-jni-cmakelists
        run: |
          sed -i "s@ncnn-[^-]*-android-vulkan@ncnn-${NCNN_VERSION}-android-vulkan@g" android/src/main/jni/CMakeLists.txt
          sed -i "s@opencv-mobile-[^-]*-android@opencv-mobile-${OPENCV_VERSION}-android@g" android/src/main/jni/CMakeLists.txt

      - name: build-apk
        run: ./gradlew :android:assembleRelease --stacktrace

      - name: sign-apk
        id: signapk
        run: |
          DATE=$(date +'%Y%m%d')
          SHA_SHORT=$(git rev-parse --short HEAD)
          UNSIGNED_APK=$(find android/build/outputs/apk/release -type f -name "*-release-unsigned.apk" | head -n 1)
          ALIGNED_APK=${UNSIGNED_APK//-release-unsigned.apk/-release-unsigned-aligned.apk}
          SIGNED_APK=${{ github.event.repository.name }}-${DATE}.${SHA_SHORT}.apk
          keytool -genkey -noprompt -alias barf \
              -dname "CN=BARF, OU=ID, O=BARF, L=London, S=London, C=GB" \
              -keystore barf.keystore -storepass barfrocks -keypass barfrocks \
              -keyalg RSA -keysize 2048 -validity 10000
          ${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/zipalign -f -v 4 ${UNSIGNED_APK} ${SIGNED_APK}
          ${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner sign --ks barf.keystore --ks-key-alias barf \
              --ks-pass pass:barfrocks --key-pass pass:barfrocks --out ${SIGNED_APK} ${SIGNED_APK}
          ${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner verify ${SIGNED_APK}
          echo "SIGNED_APK=${SIGNED_APK}" >> $GITHUB_OUTPUT
          echo "APK_VERSION=${DATE}.${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.signapk.outputs.SIGNED_APK }}

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "*"
          generate_release_notes: true
